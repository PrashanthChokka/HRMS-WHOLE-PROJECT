{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Login</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: 'Segoe UI', sans-serif;

    background: linear-gradient(135deg, #e6f4ff, #f0f9ff);
}

/* CARD */
.login-container {
    width: 100%;
    max-width: 360px;
    padding: 34px 30px;
    border-radius: 16px;

    background: #ffffff;
    box-shadow: 0 10px 25px rgba(0, 120, 255, 0.12);

    animation: fadeIn 0.4s ease;
}

@keyframes fadeIn {
    from {opacity:0; transform: translateY(12px);}
    to {opacity:1; transform: translateY(0);}
}

/* HEADER */
h2 {
    text-align: center;
    margin: 0;
    font-size: 24px;
    color: #0284c7;
}

.subtitle {
    text-align: center;
    font-size: 13px;
    color: #64748b;
    margin-top: 6px;
    margin-bottom: 22px;
}

/* MESSAGE */
.alert {
    padding: 10px 12px;
    border-radius: 10px;
    margin-bottom: 18px;
    font-size: 13px;
    display: flex;
    align-items: center;
    gap: 8px;
    border-left: 4px solid;
}

.alert.success {
    background: #ecfdf5;
    color: #16a34a;
    border-color: #22c55e;
}

.alert.error {
    background: #fef2f2;
    color: #dc2626;
    border-color: #ef4444;
}

/* INPUT */
.input-group {
    margin-bottom: 16px;
}

label {
    font-size: 12.5px;
    font-weight: 600;
    color: #475569;
    display: block;
    margin-bottom: 5px;
}

.input-wrapper {
    position: relative;
}

input {
    width: 100%;
    height: 40px;
    padding: 10px 36px 10px 12px;

    border-radius: 10px;
    border: 1px solid #e2e8f0;

    background: #f8fafc;
    font-size: 14px;
    outline: none;
    transition: 0.2s;
}

input:focus {
    border-color: #38bdf8;
    background: white;
    box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.2);
}

/* ICON */
.icon {
    position: absolute;
    right: 10px;
    top: 50%;
    transform: translateY(-50%);
    font-size: 13px;
    color: #94a3b8;
    cursor: pointer;
}

/* BUTTON */
button {
    width: 100%;
    height: 42px;
    margin-top: 8px;

    border: none;
    border-radius: 10px;
    cursor: pointer;

    font-size: 14.5px;
    font-weight: 600;

    background: linear-gradient(135deg, #38bdf8, #0ea5e9);
    color: white;

    transition: 0.25s;
}

button:hover {
    transform: translateY(-1px);
    box-shadow: 0 6px 16px rgba(56, 189, 248, 0.35);
}

/* FOOTER */
.footer {
    text-align: center;
    margin-top: 18px;
    font-size: 12.5px;
    color: #64748b;
}

.footer a {
    color: #0284c7;
    font-weight: 600;
    text-decoration: none;
}

.footer a:hover {
    text-decoration: underline;
}

</style>
</head>

<body>

<div class="login-container">

    <h2>Welcome Back</h2>
    <p class="subtitle">Sign in to continue</p>

    <!-- MESSAGES -->
    {% if messages %}
    {% for message in messages %}
        {% if 'login' in message.tags %}
            <div class="alert success">
                {{ message }}
            </div>
        {% endif %}
    {% endfor %}
{% endif %}

    <form method="POST">
        {% csrf_token %}

        <div class="input-group">
            <label>Email</label>
            <div class="input-wrapper">
                <input type="email" name="email" required>
                <span class="icon">📧</span>
            </div>
        </div>

        <div class="input-group">
            <label>Password</label>
            <div class="input-wrapper">
                <input type="password" id="password" name="password" required>
                <span class="icon" onclick="togglePassword()">👁</span>
            </div>
        </div>

        <button type="submit">Login</button>

        <div class="footer">
            Don’t have an account?
            <a href="{% url 'register' %}">Register</a>
        </div>

    </form>

</div>

<script>
function togglePassword() {
    const field = document.getElementById("password");
    field.type = field.type === "password" ? "text" : "password";
}
</script>

</body>
</html>
