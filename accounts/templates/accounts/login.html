{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login</title>

    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;

            /* animated gradient background */
            background: linear-gradient(-45deg, #A18CD1, #FBC2EB, #B39DDB, #F8BBD0);
            background-size: 400% 400%;
            animation: gradientBG 10s ease infinite;
        }

        @keyframes gradientBG {
            0% {background-position: 0% 50%;}
            50% {background-position: 100% 50%;}
            100% {background-position: 0% 50%;}
        }

        .login-box {
            width: 400px;
            padding: 30px;
            border-radius: 20px;

            /* glassmorphism */
            background: rgba(255, 255, 255, 0.25);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);

            box-shadow: 0 0 20px rgba(0,0,0,0.3),
                        inset 0 0 12px rgba(255,255,255,0.4);

            text-align: center;
        }

        .login-box h2 {
            margin-bottom: 10px;
            font-size: 28px;

            /* gradient text */
            background: linear-gradient(135deg, #7A2E9B, #FF5F9E);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .subtitle {
            margin-bottom: 20px;
            color: #4A148C;
        }

        .input-group {
            text-align: left;
            margin-bottom: 15px;
        }

        label {
            font-weight: bold;
            color: #4A148C;
        }

        input {
            width: 100%;
            padding: 10px;
            border-radius: 25px;
            border: 1px solid #aaa;
            margin-top: 5px;
            outline: none;
        }

        input:focus {
            border-color: #7A2E9B;
            box-shadow: 0 0 5px #7A2E9B;
        }

        button {
            margin-top: 15px;
            width: 160px;
            height: 45px;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            font-size: 18px;

            background: linear-gradient(135deg, #43E97B, #38F9D7);
            color: #0B3D2E;
            transition: 0.3s;
        }

        button:hover {
            transform: scale(1.05);
            box-shadow: 0 0 15px #38F9D7;
        }

        .register-link {
            margin-top: 15px;
            border-top: 1px solid #aaa;
            padding-top: 10px;
            color: #4A148C;
        }

        .register-link a {
            color: #6A1B9A;
            text-decoration: none;
            font-weight: bold;
        }

        .register-link a:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>

<div class="login-box">
    <h2>Welcome Back</h2>
    <p class="subtitle">Login to your account</p>
    {% if messages %}
    {% for message in messages %}
        <p style="color: red; font-weight: bold; margin-bottom: 10px;">
            {{ message }}
        </p>
    {% endfor %}
{% endif %}


    <form method="POST">
        {% csrf_token %}

        <div class="input-group">
            <label>Email</label>
            <input type="email" name="email" placeholder="Enter your email" required>
        </div>

        <div class="input-group">
            <label>Password</label>
            <input type="password" name="password" placeholder="Enter your password" required>
        </div>

        <button type="submit">Login</button>

        <p class="register-link">
            Don’t have an account?
            <a href="{% url 'register' %}">Register</a>
        </p>
    </form>
</div>

</body>
</html>
