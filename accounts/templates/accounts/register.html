{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Register</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: 'Segoe UI', sans-serif;

    background: linear-gradient(135deg, #e0f2fe, #f0f9ff);
}

/* MAIN CARD */
.container {
    width: 100%;
    max-width: 420px;
    padding: 35px;
    border-radius: 16px;

    background: white;
    box-shadow: 0 12px 30px rgba(14, 165, 233, 0.15);

    animation: fadeIn 0.4s ease;
}

@keyframes fadeIn {
    from {opacity:0; transform: translateY(10px);}
    to {opacity:1; transform: translateY(0);}
}

/* HEADER */
h1 {
    text-align: center;
    margin-bottom: 5px;
    color: #0284c7;
    font-size: 26px;
}

.subtitle {
    text-align: center;
    font-size: 14px;
    color: #64748b;
    margin-bottom: 25px;
}

/* ALERT */
.alert {
    padding: 10px;
    border-radius: 10px;
    margin-bottom: 15px;
    font-size: 14px;
    border-left: 4px solid;
}

.alert.error {
    background: #fef2f2;
    color: #ef4444;
    border-color: #f87171;
}

.alert.success {
    background: #f0fdf4;
    color: #22c55e;
    border-color: #4ade80;
}

/* INPUT GROUP */
.input-group {
    margin-bottom: 16px;
}

label {
    display: block;
    font-size: 13px;
    color: #475569;
    font-weight: 600;
    margin-bottom: 5px;
}

/* INPUT WRAPPER (fix alignment issue) */
.input-wrapper {
    position: relative;
}

/* INPUT */
input, select {
    width: 100%;
    height: 42px;
    padding: 10px 40px 10px 12px;

    border-radius: 10px;
    border: 1px solid #e2e8f0;
    outline: none;

    font-size: 14px;
    background: #f8fafc;
    transition: 0.2s;
}

/* FIXED ALIGNMENT */
input:focus, select:focus {
    border-color: #38bdf8;
    background: white;
    box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.2);
}

/* ICON */
.input-icon {
    position: absolute;
    right: 12px;
    top: 50%;
    transform: translateY(-50%);
    font-size: 14px;
    color: #94a3b8;
    cursor: pointer;
}

/* BUTTON */
button {
    width: 100%;
    padding: 12px;
    border-radius: 10px;
    border: none;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;

    background: linear-gradient(135deg, #38bdf8, #0ea5e9);
    color: white;
    transition: 0.25s;
    margin-top: 10px;
}

button:hover {
    transform: translateY(-1px);
    box-shadow: 0 8px 18px rgba(56, 189, 248, 0.35);
}

/* LINK */
.login-text {
    margin-top: 18px;
    text-align: center;
    font-size: 13px;
    color: #64748b;
}

.login-text a {
    color: #0284c7;
    font-weight: 600;
    text-decoration: none;
}

.login-text a:hover {
    text-decoration: underline;
}

</style>
</head>

<body>

<div class="container">

    <h1>Create Account</h1>
    <p class="subtitle">Fill your details to register</p>

    <!-- MESSAGES -->
    {% if messages %}
        {% for message in messages %}
            <div class="alert {% if 'error' in message.tags %}error{% else %}success{% endif %}">
                {{ message }}
            </div>
        {% endfor %}
    {% endif %}

    <form method="POST">
        {% csrf_token %}

        <div class="input-group">
            <label>First Name</label>
            <div class="input-wrapper">
                <input type="text" name="first_name" required>
            </div>
        </div>

        <div class="input-group">
            <label>Last Name</label>
            <div class="input-wrapper">
                <input type="text" name="last_name" required>
            </div>
        </div>

        <div class="input-group">
            <label>Email</label>
            <div class="input-wrapper">
                <input type="email" name="email" required>
                <span class="input-icon">📧</span>
            </div>
        </div>

        <div class="input-group">
            <label>Password</label>
            <div class="input-wrapper">
                <input type="password" id="password" name="password" required>
                <span class="input-icon" onclick="togglePassword()">👁</span>
            </div>
        </div>

        <div class="input-group">
            <label>Mobile</label>
            <div class="input-wrapper">
                <input type="text" name="mobile" required>
            </div>
        </div>

        <div class="input-group">
            <label>Gender</label>
            <div class="input-wrapper">
                <select name="gender">
                    <option value="Male">Male</option>
                    <option value="Female">Female</option>
                </select>
            </div>
        </div>

        <button type="submit">Register</button>

        <p class="login-text">
            Already registered?
            <a href="{% url 'login' %}">Login</a>
        </p>

    </form>

</div>

<script>
function togglePassword() {
    const field = document.getElementById("password");
    field.type = field.type === "password" ? "text" : "password";
}
</script>

</body>
</html>
